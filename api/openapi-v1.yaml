        packageWeightKg:
          type: number
        orderMoqKg:
          type: number
        lineMoqKg:
          type: number
        specification:
          type: string
        publicDescription:
          type: string
        allowSample:
          type: boolean
        onHandKg:
          type: number
        tempLockedKg:
          type: number
        committedKg:
          type: number
        availableKg:
          type: number
          readOnly: true
        reviewStatus:
          $ref: '#/components/schemas/SupplyReviewStatus'
        publishStatus:
