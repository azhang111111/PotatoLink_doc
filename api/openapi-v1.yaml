    SupplyBatchUpsertRequest:
      type: object
      required:
        - batchNo
        - businessType
        - varietyId
        - baseId
        - cropYear
        - supplyStatus
        - quantityVisibility
        - packageTypeCode
        - packageWeightKg
        - allowSample
        - onHandKg
      properties:
        batchNo:
          type: string
          maxLength: 100
        businessType:
          $ref: '#/components/schemas/BusinessType'
        varietyId:
          $ref: '#/components/schemas/SnowflakeId'
        baseId:
          $ref: '#/components/schemas/SnowflakeId'
        cropYear:
          type: integer
          minimum: 2020
          maximum: 2100
        harvestAt:
          type: string
          format: date
        availableFrom:
          type: string
          format: date
        supplyStatus:
          $ref: '#/components/schemas/PublicSupplyStatus'
        quantityVisibility:
          type: string
          enum: [RANGE, STATUS_ONLY, HIDDEN]
        publicQuantityRange:
          type: string
          maxLength: 100
        packageTypeCode:
          type: string
          maxLength: 100
        packageWeightKg:
          type: number
          exclusiveMinimum: 0
        orderMoqKg:
          type: number
          exclusiveMinimum: 0
        lineMoqKg:
          type: number
          exclusiveMinimum: 0
        specification:
          type: string
          maxLength: 300
        publicDescription:
          type: string
          maxLength: 3000
        allowSample:
          type: boolean
        onHandKg:
          type: number
          minimum: 0
    SupplyBatchReviewRequest:
      type: object
