        items:
          type: array
          items:
            $ref: '#/components/schemas/SupplyBatchSummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    SupplyBatchPageResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/SupplyBatchPage'
        requestId:
          type: string
    SupplyBatchDetailResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/SupplyBatchDetail'
        requestId:
          type: string
    SupplyReviewStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED]
    SupplyPublishStatus:
      type: string
      enum: [DRAFT, PUBLISHED, OFFLINE]
    SupplyBaseOption:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        name:
          type: string
    SupplyBaseOptionListResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/SupplyBaseOption'
        requestId:
          type: string
    AdminSupplyBatch:
      type: object
