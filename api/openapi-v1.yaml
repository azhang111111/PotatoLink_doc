          minLength: 1
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        mobile:
          type: string
          maxLength: 32
        initialPassword:
          type: string
          minLength: 8
          maxLength: 128
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ADMIN, SALES_MANAGER, SALES]
    UpdateInternalUserRequest:
      type: object
      required: [displayName, enabled, roles]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        mobile:
          type: string
          maxLength: 32
        enabled:
          type: boolean
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [ADMIN, SALES_MANAGER, SALES]
    ResetInternalUserPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
    AdminPrincipal:
      type: object
      required: [id, username, displayName, enabled, roles]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        username:
          type: string
        displayName:
          type: string
        mobile:
          type: string
          nullable: true
        enabled:
          type: boolean
        roles:
          type: array
          items:
            type: string
    AdminTokenData:
      type: object
      required: [accessToken, refreshToken, accessExpiresAt, refreshExpiresAt, user]
      properties:
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        user:
