openapi: 3.1.0
info:
  title: PotatoLink API
  version: 0.1.0
  description: |
    PotatoLink 中俄薯贸 MVP API 契约草案。
    本文件覆盖“公开展示—供应—询价—后台跟进—报价审批”M2 切片。
    所有雪花 ID、金额和重量在 JSON 中均使用字符串。
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Public
  - name: Authentication
  - name: Admin identity
  - name: Admin inquiries
  - name: Admin quotations
paths:
  /public/company:
    get:
      tags: [Public]
      operationId: getPublicCompany
      summary: Get public company profile
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/varieties:
    get:
      tags: [Public]
      operationId: listPublicVarieties
      summary: List published potato varieties
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: businessType
          in: query
          schema:
            $ref: '#/components/schemas/BusinessType'
        - name: maturityType
          in: query
          schema:
            type: string
        - name: useCase
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Published varieties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VarietyPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/varieties/{id}:
    get:
      tags: [Public]
      operationId: getPublicVariety
      summary: Get a published variety
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Variety detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VarietyDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/supply-batches:
    get:
      tags: [Public]
      operationId: listPublicSupplyBatches
      summary: List public supply batches
      description: Exact inventory, internal price, cost, and internal notes are never returned.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: businessType
          in: query
          schema:
            $ref: '#/components/schemas/BusinessType'
        - name: varietyId
          in: query
          schema:
            $ref: '#/components/schemas/SnowflakeId'
        - name: supplyStatus
          in: query
          schema:
            $ref: '#/components/schemas/PublicSupplyStatus'
      responses:
        '200':
          description: Public supply batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyBatchPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /public/supply-batches/{id}:
    get:
      tags: [Public]
      operationId: getPublicSupplyBatch
      summary: Get a public supply batch
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Public supply batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyBatchDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/supply-bases:
    get:
      tags: [Admin supply]
      operationId: listSupplyBases
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Available production bases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyBaseOptionListResponse'
  /admin/supply-batches:
    get:
      tags: [Admin supply]
      operationId: listAdminSupplyBatches
      summary: List supply batches including internal inventory and workflow states
      security:
        - BearerAuth: []
      parameters:
        - name: businessType
          in: query
          schema:
            $ref: '#/components/schemas/BusinessType'
        - name: reviewStatus
          in: query
          schema:
            $ref: '#/components/schemas/SupplyReviewStatus'
        - name: publishStatus
          in: query
          schema:
            $ref: '#/components/schemas/SupplyPublishStatus'
      responses:
        '200':
          description: Internal supply batch list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchListResponse'
    post:
      tags: [Admin supply]
      operationId: createSupplyBatch
      summary: Create a draft commodity or seed potato batch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyBatchUpsertRequest'
      responses:
        '200':
          description: Draft batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/supply-batches/{id}:
    get:
      tags: [Admin supply]
      operationId: getAdminSupplyBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Internal batch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchResponse'
    put:
      tags: [Admin supply]
      operationId: updateSupplyBatch
      summary: Update a batch and return it to draft review status
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyBatchUpsertRequest'
      responses:
        '200':
          description: Batch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/supply-batches/{id}/submit-review:
    post:
      tags: [Admin supply]
      operationId: submitSupplyBatchReview
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Batch submitted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchResponse'
  /admin/supply-batches/{id}/review:
    post:
      tags: [Admin supply]
      operationId: reviewSupplyBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyBatchReviewRequest'
      responses:
        '200':
          description: Review decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/supply-batches/{id}/publish:
    post:
      tags: [Admin supply]
      operationId: publishSupplyBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Approved batch published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchResponse'
  /admin/supply-batches/{id}/unpublish:
    post:
      tags: [Admin supply]
      operationId: unpublishSupplyBatch
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Published batch taken offline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupplyBatchResponse'
  /public/inquiries:
    post:
      tags: [Public]
      operationId: createPublicInquiry
      summary: Submit a commodity or seed potato inquiry
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
      responses:
        '201':
          description: Inquiry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/admin/login:
    post:
      tags: [Authentication]
      operationId: loginAdmin
      summary: Authenticate an internal user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/token/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAdminSession
      summary: Rotate an internal access and refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Rotated authentication tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/admin/logout:
    post:
      tags: [Authentication]
      operationId: logoutAdmin
      summary: Revoke the current internal session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session revoked
  /admin/me:
    get:
      tags: [Admin identity]
      operationId: getCurrentInternalUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current internal user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrincipalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/internal-users:
    get:
      tags: [Admin identity]
      operationId: listInternalUsers
      summary: List internal users visible to the current manager or administrator
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Internal user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrincipalListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin identity]
      operationId: createInternalUser
      summary: Create an internal user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInternalUserRequest'
      responses:
        '200':
          description: Internal user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrincipalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/internal-users/{id}:
    put:
      tags: [Admin identity]
      operationId: updateInternalUser
      summary: Update an internal user's profile, status, and roles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SnowflakeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInternalUserRequest'
      responses:
        '200':
          description: Internal user updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrincipalResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/internal-users/{id}/reset-password:
    post:
      tags: [Admin identity]
      operationId: resetInternalUserPassword
      summary: Reset an internal user's password and revoke existing sessions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SnowflakeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInternalUserPasswordRequest'
      responses:
        '200':
          description: Password reset and sessions revoked
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/internal-users/assignable:
    get:
      tags: [Admin identity]
      operationId: listAssignableInternalUsers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Enabled sales users eligible for assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrincipalListResponse'
  /admin/inquiries:
    get:
      tags: [Admin inquiries]
      operationId: listAdminInquiries
      summary: List inquiries visible to the internal user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: businessType
          in: query
          schema:
            $ref: '#/components/schemas/BusinessType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InquiryStatus'
        - name: ownerUserId
          in: query
          schema:
            $ref: '#/components/schemas/SnowflakeId'
        - name: slaStatus
          in: query
          schema:
            type: string
            enum: [ON_TIME, RESPONSE_DUE, ESCALATED, TIMED_OUT]
      responses:
        '200':
          description: Inquiry page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInquiryPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/inquiries/{id}:
    get:
      tags: [Admin inquiries]
      operationId: getAdminInquiry
      summary: Get inquiry detail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Inquiry detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInquiryDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/inquiries/{id}/assign:
    post:
      tags: [Admin inquiries]
      operationId: assignAdminInquiry
      summary: Assign an inquiry owner and backup owner
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryAssignRequest'
      responses:
        '200':
          description: Updated inquiry detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInquiryDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/inquiries/{id}/follow-ups:
    post:
      tags: [Admin inquiries]
      operationId: addInquiryFollowUp
      summary: Add an inquiry follow-up
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowUpCreateRequest'
      responses:
        '200':
          description: Follow-up created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowUpCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/inquiries/{id}/quotations:
    post:
      tags: [Admin quotations]
      operationId: createQuotation
      summary: Create the first quotation version for an inquiry
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationCreateRequest'
      responses:
        '200':
          description: Quotation created and approval route evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/quotations:
    get:
      tags: [Admin quotations]
      operationId: listQuotations
      summary: List quotations
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/QuotationStatus'
      responses:
        '200':
          description: Quotation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/quotations/{id}:
    get:
      tags: [Admin quotations]
      operationId: getQuotation
      summary: Get quotation detail
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Quotation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/quotations/{id}/approval:
    post:
      tags: [Admin quotations]
      operationId: decideQuotationApproval
      summary: Approve or reject a quotation version
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationApprovalRequest'
      responses:
        '200':
          description: Approval decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/quotations/{id}/versions:
    get:
      tags: [Admin quotations]
      operationId: listQuotationVersions
      summary: List all immutable versions of a quotation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Version history, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
    post:
      tags: [Admin quotations]
      operationId: reviseQuotation
      summary: Create a new version after rejection or a customer revision request
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationCreateRequest'
      responses:
        '200':
          description: New current version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
  /admin/quotations/{id}/send:
    post:
      tags: [Admin quotations]
      operationId: sendQuotation
      summary: Mark an approved quotation as sent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Quotation marked as sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/quotations/{id}/secure-links:
    post:
      tags: [Admin quotations]
      operationId: createQuotationSecureLink
      summary: Revoke old links and create a time-limited customer link
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                validityDays:
                  type: integer
                  minimum: 1
                  maximum: 30
      responses:
        '200':
          description: Secure link generated; the raw token is returned only in the URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecureQuotationLinkResponse'
  /admin/quotations/{id}/secure-links/revoke:
    post:
      tags: [Admin quotations]
      operationId: revokeQuotationSecureLinks
      summary: Revoke all active links for a quotation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
      responses:
        '200':
          description: Links revoked
  /secure/quotations/{quotationNo}:
    get:
      tags: [Secure quotations]
      operationId: viewSecureQuotation
      summary: View the current customer-safe quotation version
      security:
        - SecureAccessToken: []
      parameters:
        - name: quotationNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer quotation view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerQuotationViewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /secure/quotation-versions/{id}/accept:
    post:
      tags: [Secure quotations]
      operationId: acceptQuotation
      summary: Accept the current valid quotation version
      security:
        - SecureAccessToken: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerQuotationFeedbackRequest'
      responses:
        '200':
          description: Customer decision recorded idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationResponse'
  /secure/quotation-versions/{id}/reject:
    post:
      tags: [Secure quotations]
      operationId: rejectQuotation
      summary: Reject the current quotation version
      security:
        - SecureAccessToken: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerQuotationFeedbackRequest'
      responses:
        '200':
          description: Customer decision recorded idempotently
  /secure/quotation-versions/{id}/request-revision:
    post:
      tags: [Secure quotations]
      operationId: requestQuotationRevision
      summary: Ask the sales team for a revised quotation
      security:
        - SecureAccessToken: []
      parameters:
        - $ref: '#/components/parameters/SnowflakeIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerQuotationFeedbackRequest'
      responses:
        '200':
          description: Revision request recorded idempotently
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    SecureAccessToken:
      type: apiKey
      in: header
      name: X-Secure-Access-Token
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum: [zh-CN, ru-RU]
        default: zh-CN
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    SnowflakeIdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SnowflakeId'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found or hidden from current caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Resource state or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Business rule validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SnowflakeId:
      type: string
      pattern: '^[1-9][0-9]{18}$'
      example: '1987654321098765432'
    DecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      example: '25000.000'
    BusinessType:
      type: string
      enum: [COMMODITY, SEED]
    PublicSupplyStatus:
      type: string
      enum:
        - COMING_SOON
        - AVAILABLE
        - PREORDER
        - LIMITED
        - PAUSED
        - SOLD_OUT
    InquiryStatus:
      type: string
      enum:
        - PENDING_ASSIGNMENT
        - ASSIGNED
        - FOLLOWING
        - REQUIREMENT_CONFIRMED
        - QUOTING
        - QUOTED
        - WON
        - LOST
        - CLOSED
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - UNSUPPORTED_LOCALE
        - UNAUTHENTICATED
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - EMAIL_CODE_INVALID
        - EMAIL_CODE_EXPIRED
        - FORBIDDEN
        - DATA_SCOPE_FORBIDDEN
        - RESOURCE_NOT_FOUND
        - STATE_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
        - CONTACT_METHOD_REQUIRED
        - CUSTOMER_MERGED
        - VARIETY_NOT_PUBLISHED
        - SUPPLY_BATCH_NOT_AVAILABLE
        - BUSINESS_TYPE_MISMATCH
        - MIXED_VARIETY_IN_ITEM
        - MOQ_NOT_MET
        - SPECIAL_REVIEW_REQUIRED
        - INQUIRY_ALREADY_CLOSED
        - INQUIRY_OWNER_REQUIRED
        - INQUIRY_STATUS_INVALID
        - QUOTATION_APPROVAL_REQUIRED
        - QUOTATION_VERSION_IMMUTABLE
        - QUOTATION_NOT_SENT
        - QUOTATION_EXPIRED
        - QUOTATION_ALREADY_ACCEPTED
        - QUOTATION_ACCESS_DENIED
        - INVENTORY_INSUFFICIENT
        - INVENTORY_RESERVATION_EXPIRED
        - INVENTORY_RESERVATION_CONFLICT
        - ORDER_STATUS_INVALID
        - ORDER_ACCESS_DENIED
        - ROUTE_NOT_ACTIVE
        - CONTRACT_REQUIRED
        - SAMPLE_VARIETY_LIMIT_EXCEEDED
        - SAMPLE_REVIEW_REQUIRED
        - SAMPLE_STATUS_INVALID
        - DOCUMENT_NOT_VERIFIED
        - DOCUMENT_EXPIRED
        - DOCUMENT_ACCESS_DENIED
        - FILE_TYPE_NOT_ALLOWED
        - FILE_TOO_LARGE
        - NOTIFICATION_SEND_FAILED
        - EXPORT_PERMISSION_REQUIRED
    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          example: items[0].quantityKg
        reason:
          type: string
          example: must be greater than zero
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          example: Request validation failed
        requestId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    MediaAsset:
      type: object
      required: [url, mediaType]
      properties:
        url:
          type: string
          format: uri
        mediaType:
          type: string
          enum: [IMAGE, VIDEO]
        altText:
          type: string
    Company:
      type: object
      required: [id, legalName, displayName, description]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        legalName:
          type: string
        displayName:
          type: string
        description:
          type: string
        contact:
          type: object
          additionalProperties: true
        logoUrl:
          type: string
          format: uri
    CompanyResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/Company'
        requestId:
          type: string
    VarietySummary:
      type: object
      required: [id, code, name, maturityType, commodityEnabled, seedEnabled]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        maturityType:
          type: string
        commodityEnabled:
          type: boolean
        seedEnabled:
          type: boolean
        coverImageUrl:
          type: string
          format: uri
    VarietyDetail:
      allOf:
        - $ref: '#/components/schemas/VarietySummary'
        - type: object
          required: [advantages, risks, recommendedUses]
          properties:
            growthDays:
              type: string
            skinColor:
              type: string
            fleshColor:
              type: string
            shape:
              type: string
            advantages:
              type: array
              items:
                type: string
            risks:
              type: array
              items:
                type: string
            recommendedUses:
              type: array
              items:
                type: string
            media:
              type: array
              items:
                $ref: '#/components/schemas/MediaAsset'
    VarietyPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VarietySummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    VarietyPageResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/VarietyPage'
        requestId:
          type: string
    VarietyDetailResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/VarietyDetail'
        requestId:
          type: string
    SupplyBatchSummary:
      type: object
      required:
        - id
