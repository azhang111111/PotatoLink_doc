        - variety
        - baseId
        - baseName
        - cropYear
        - supplyStatus
        - quantityVisibility
        - packageTypeCode
        - packageWeightKg
        - allowSample
        - onHandKg
        - tempLockedKg
        - committedKg
        - availableKg
        - reviewStatus
        - publishStatus
        - versionNo
