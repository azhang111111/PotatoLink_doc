      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminSupplyBatch'
        requestId:
          type: string
    AdminSupplyBatchListResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupplyBatch'
        requestId:
          type: string
    ContactInput:
      type: object
      required: [contactName, countryCode]
      properties:
        companyName:
          type: string
          maxLength: 200
        contactName:
          type: string
          minLength: 1
          maxLength: 100
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        region:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        telegram:
          type: string
          maxLength: 100
      anyOf:
        - required: [phone]
        - required: [email]
    InquiryItemInput:
      type: object
      required: [quantityKg, originalQuantity, originalUnit]
      properties:
        varietyId:
          $ref: '#/components/schemas/SnowflakeId'
        recommendationRequested:
          type: boolean
          default: false
        quantityKg:
          $ref: '#/components/schemas/DecimalString'
        originalQuantity:
          $ref: '#/components/schemas/DecimalString'
        originalUnit:
          type: string
          enum: [KG, TON]
        useCase:
          type: string
        specification:
          type: string
        washed:
          type: boolean
        packageTypeCode:
          type: string
        notes:
          type: string
          maxLength: 1000
      oneOf:
        - required: [varietyId]
        - required: [recommendationRequested]
          properties:
            recommendationRequested:
              const: true
    CommodityInquiryItemInput:
      allOf:
        - $ref: '#/components/schemas/InquiryItemInput'
        - type: object
          required: [useCase, specification, washed, packageTypeCode]
    SeedInquiryItemInput:
      allOf:
        - $ref: '#/components/schemas/InquiryItemInput'
        - type: object
          required: [specification, packageTypeCode]
    SeedRequirementInput:
      type: object
      required:
        - plantingCountryCode
        - plantingRegion
        - plantingArea
        - plantingAreaUnit
        - soilType
        - irrigated
        - continuousCropping
        - expectedPlantingDate
        - targetHarvestDate
      properties:
        plantingCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        plantingRegion:
          type: string
        plantingArea:
          $ref: '#/components/schemas/DecimalString'
        plantingAreaUnit:
          type: string
        soilType:
          type: string
        irrigated:
          type: boolean
        continuousCropping:
          type: boolean
        expectedPlantingDate:
          type: string
          format: date
        targetHarvestDate:
          type: string
          format: date
        requestedSeedClassCode:
          type: string
        seedClassRecommendationRequested:
          type: boolean
          default: false
      oneOf:
        - required: [requestedSeedClassCode]
        - required: [seedClassRecommendationRequested]
          properties:
            seedClassRecommendationRequested:
              const: true
    DeliveryRequirementInput:
      type: object
      required: [countryCode, expectedDeliveryDate]
      properties:
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        city:
          type: string
        portOrHandoverPoint:
          type: string
        expectedDeliveryDate:
          type: string
          format: date
      anyOf:
        - required: [city]
        - required: [portOrHandoverPoint]
    ConsentInput:
      type: object
      required: [privacyPolicyVersion, privacyAccepted]
      properties:
        privacyPolicyVersion:
          type: string
        privacyAccepted:
          type: boolean
          const: true
        marketingAccepted:
          type: boolean
          default: false
    InquiryBaseFields:
      type: object
      required:
        - preferredLocale
        - contact
        - delivery
        - consent
      properties:
        preferredLocale:
          type: string
          enum: [zh-CN, ru-RU]
        contact:
          $ref: '#/components/schemas/ContactInput'
        delivery:
          $ref: '#/components/schemas/DeliveryRequirementInput'
        specialRequirement:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 2000
        consent:
          $ref: '#/components/schemas/ConsentInput'
    CommodityInquiryCreateRequest:
      allOf:
        - $ref: '#/components/schemas/InquiryBaseFields'
        - type: object
          required: [businessType, items]
          properties:
            businessType:
              const: COMMODITY
            items:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '#/components/schemas/CommodityInquiryItemInput'
    SeedInquiryCreateRequest:
      allOf:
        - $ref: '#/components/schemas/InquiryBaseFields'
        - type: object
          required: [businessType, items, seedRequirement]
          properties:
            businessType:
              const: SEED
            items:
              type: array
              minItems: 1
              maxItems: 20
              items:
                $ref: '#/components/schemas/SeedInquiryItemInput'
            seedRequirement:
              $ref: '#/components/schemas/SeedRequirementInput'
    InquiryCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/CommodityInquiryCreateRequest'
        - $ref: '#/components/schemas/SeedInquiryCreateRequest'
      discriminator:
        propertyName: businessType
        mapping:
          COMMODITY: '#/components/schemas/CommodityInquiryCreateRequest'
          SEED: '#/components/schemas/SeedInquiryCreateRequest'
    InquiryCreated:
      type: object
      required: [id, inquiryNo, status, submittedAt]
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeId'
        inquiryNo:
          type: string
        status:
          $ref: '#/components/schemas/InquiryStatus'
        submittedAt:
          type: string
          format: date-time
        specialReviewRequired:
          type: boolean
    InquiryCreatedResponse:
      type: object
      required: [code, message, data, requestId]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/InquiryCreated'
        requestId:
          type: string
    AdminLoginRequest:
