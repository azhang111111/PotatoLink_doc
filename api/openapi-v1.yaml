        businessType:
          $ref: '#/components/schemas/BusinessType'
        variety:
          $ref: '#/components/schemas/VarietySummary'
        baseId:
          $ref: '#/components/schemas/SnowflakeId'
        baseName:
          type: string
        cropYear:
          type: integer
        harvestAt:
          type: string
          format: date
        availableFrom:
          type: string
          format: date
        supplyStatus:
          $ref: '#/components/schemas/PublicSupplyStatus'
        quantityVisibility:
          type: string
